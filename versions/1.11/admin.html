</head>

  <div class="admin-app">
    <aside class="sidebar">
      <a class="product-lockup" href="admin.html" aria-label="打开图标控制台">
        <span class="product-lockup__badge">1.7</span>
        <span>
          <strong>图标控制台</strong>
          <small>Aircraft Icon Ops</small>
        </span>
      </a>

      <nav class="sidebar-nav" id="adminNav" aria-label="后台导航">
        <button class="nav-item" type="button" data-view="dashboard"><svg><use href="#icon-dashboard"></use></svg><span>Dashboard</span></button>
        <button class="nav-item" type="button" data-view="icons"><svg><use href="#icon-plane"></use></svg><span>Icon Library</span></button>
        <button class="nav-item" type="button" data-view="mappings"><svg><use href="#icon-table"></use></svg><span>Type Mappings</span></button>
        <button class="nav-item" type="button" data-view="preview"><svg><use href="#icon-eye"></use></svg><span>Preview Lab</span></button>
        <button class="nav-item" type="button" data-view="publish"><svg><use href="#icon-publish"></use></svg><span>Publish Center</span></button>
        <button class="nav-item" type="button" data-view="audit"><svg><use href="#icon-history"></use></svg><span>Audit Log</span></button>
        <button class="nav-item" type="button" data-view="settings"><svg><use href="#icon-settings"></use></svg><span>Settings</span></button>
      </nav>

      <div class="sidebar-status">
        <span>环境</span>
        <strong>Local Draft</strong>
        <small id="sidebarVersion">icon-map-1.7-template-shadow-fr24yellow</small>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">CONFIG CONTROL</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <a class="button button--ghost" href="index.html">地图页</a>
          <button class="button button--ghost" type="button" data-action="export-json"><svg><use href="#icon-download"></use></svg><span>导出 JSON</span></button>
          <button class="button button--primary" type="button" data-action="publish-shortcut"><svg><use href="#icon-publish"></use></svg><span>发布草稿</span></button>
        </div>
      </header>

      <section class="view is-active" id="dashboardView" data-view-panel="dashboard"></section>
      <section class="view" id="iconsView" data-view-panel="icons"></section>
      <section class="view" id="mappingsView" data-view-panel="mappings"></section>
      <section class="view" id="previewView" data-view-panel="preview"></section>
      <section class="view" id="publishView" data-view-panel="publish"></section>
      <section class="view" id="auditView" data-view-panel="audit"></section>
      <section class="view" id="settingsView" data-view-panel="settings"></section>
    </main>

    <aside class="editor-panel" id="editorPanel" aria-label="机型映射编辑"></aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="aircraft-icon-config.js?v=1.11-icao-icon-priority"></script>
  <script src="admin.js?v=1.11-icao-icon-priority"></script>
</body>
</html>
